<mat-toolbar class="app-header">
  @if (!layoutUi.sidebarOpened()) {
    <button
      mat-icon-button
      type="button"
      class="sidebar-toggle"
      (click)="layoutUi.toggleSidebar()"
      aria-label="Open menu"
    >
      <mat-icon>read_more</mat-icon>
    </button>
  }

  @if (pageChrome.title()) {
    <div class="header-page-chrome" [class.has-back]="!!pageChrome.onBack()">
      @if (pageChrome.onBack()) {
        <button
          type="button"
          class="header-back-btn"
          (click)="pageChrome.goBack()"
          aria-label="Back"
        >
          <mat-icon>arrow_back</mat-icon>
          <span>Back</span>
        </button>
      }
      <div class="header-page-text">
        <div class="header-page-title">{{ pageChrome.title() }}</div>
        @if (pageChrome.subtitle()) {
          <div class="header-page-subtitle">{{ pageChrome.subtitle() }}</div>
        }
      </div>
    </div>
  }

  <span class="spacer"></span>

  <button mat-icon-button type="button" [matMenuTriggerFor]="userMenu" aria-label="User menu">
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item disabled>
      <mat-icon>person</mat-icon>
      <span>{{ auth.currentUser?.name ?? 'Signed in user' }}</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item type="button" (click)="onLogout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
